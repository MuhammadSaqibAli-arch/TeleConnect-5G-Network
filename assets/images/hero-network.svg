<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 550" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A86FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Backdrops -->
  <circle cx="325" cy="275" r="180" fill="#00D2FF" opacity="0.08" filter="url(#heroGlow)"/>
  <circle cx="450" cy="180" r="130" fill="#3A86FF" opacity="0.12" filter="url(#heroGlow)"/>

  <!-- Orbital Rings / Signal Waves -->
  <circle cx="325" cy="280" r="230" stroke="url(#glowGrad)" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.25"/>
  <circle cx="325" cy="280" r="170" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>
  <circle cx="325" cy="280" r="110" stroke="url(#glowGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="325" cy="280" r="60" stroke="#00D2FF" stroke-width="2.5" opacity="0.75" filter="url(#softGlow)"/>

  <!-- Satellite Connection Beam -->
  <line x1="140" y1="110" x2="325" y2="280" stroke="#00D2FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="510" y1="120" x2="325" y2="280" stroke="#3A86FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="480" y1="420" x2="325" y2="280" stroke="#00D2FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="150" y1="410" x2="325" y2="280" stroke="#3A86FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Central Telecom Tower Hub -->
  <g transform="translate(325, 280)">
    <!-- Base Platform -->
    <ellipse cx="0" cy="130" rx="90" ry="24" fill="#0F172A" stroke="url(#glowGrad)" stroke-width="2"/>
    <ellipse cx="0" cy="120" rx="65" ry="18" fill="#1E293B" stroke="#00D2FF" stroke-width="1.5"/>

    <!-- Tower Truss Structure -->
    <path d="M-40 120 L -12 -30 L 12 -30 L 40 120 Z" fill="url(#bgGrad)" stroke="#3A86FF" stroke-width="2"/>
    <line x1="-32" y1="80" x2="32" y2="80" stroke="#00D2FF" stroke-width="2"/>
    <line x1="-22" y1="35" x2="22" y2="35" stroke="#00D2FF" stroke-width="2"/>
    <!-- Diagonal Braces -->
    <line x1="-40" y1="120" x2="32" y2="80" stroke="#3A86FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="40" y1="120" x2="-32" y2="80" stroke="#3A86FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="-32" y1="80" x2="22" y2="35" stroke="#3A86FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="32" y1="80" x2="-22" y2="35" stroke="#3A86FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="-22" y1="35" x2="12" y2="-30" stroke="#3A86FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="22" y1="35" x2="-12" y2="-30" stroke="#3A86FF" stroke-width="1.5" opacity="0.7"/>

    <!-- Antenna Mast -->
    <line x1="0" y1="-30" x2="0" y2="-90" stroke="#00D2FF" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Radar Transceivers -->
    <rect x="-18" y="-45" width="36" height="12" rx="4" fill="#0F172A" stroke="#00D2FF" stroke-width="2"/>
    <rect x="-14" y="-70" width="28" height="10" rx="3" fill="#0F172A" stroke="#3A86FF" stroke-width="2"/>
    <!-- Pulsing Transmitter Tip -->
    <circle cx="0" cy="-92" r="7" fill="#00D2FF" filter="url(#heroGlow)"/>
    <circle cx="0" cy="-92" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Floating Feature Card 1: 5G Ultra Speed (Top Left) -->
  <g transform="translate(60, 60)">
    <rect width="180" height="74" rx="16" fill="#0B192C" fill-opacity="0.9" stroke="url(#glowGrad)" stroke-width="1.5" filter="url(#softGlow)"/>
    <circle cx="36" cy="37" r="18" fill="url(#glowGrad)"/>
    <!-- Speedometer Icon -->
    <path d="M28 42 A 10 10 0 1 1 44 42" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="36" y1="37" x2="41" y2="31" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">5G PEAK SPEED</text>
    <text x="65" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">1.45 <tspan font-size="12" fill="#00D2FF">Gbps</tspan></text>
  </g>

  <!-- Floating Feature Card 2: 99.99% Network Uptime (Top Right) -->
  <g transform="translate(420, 75)">
    <rect width="175" height="74" rx="16" fill="#0B192C" fill-opacity="0.9" stroke="url(#glowGrad)" stroke-width="1.5" filter="url(#softGlow)"/>
    <circle cx="36" cy="37" r="18" fill="#10B981" fill-opacity="0.2"/>
    <circle cx="36" cy="37" r="12" fill="#10B981"/>
    <!-- Shield / Check Icon -->
    <path d="M30 37 L34 41 L42 33" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">NETWORK HEALTH</text>
    <text x="65" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">99.99% <tspan font-size="11" fill="#10B981">Up</tspan></text>
  </g>

  <!-- Floating Feature Card 3: Ultra Low Latency (Bottom Right) -->
  <g transform="translate(430, 390)">
    <rect width="180" height="74" rx="16" fill="#0B192C" fill-opacity="0.9" stroke="url(#glowGrad)" stroke-width="1.5" filter="url(#softGlow)"/>
    <circle cx="36" cy="37" r="18" fill="url(#violetGrad)"/>
    <!-- Lightning bolt -->
    <path d="M37 26 L30 36 L36 36 L34 48 L43 38 L37 38 Z" fill="#FFFFFF"/>
    <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">EDGE LATENCY</text>
    <text x="65" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">4 ms <tspan font-size="11" fill="#A855F7">PING</tspan></text>
  </g>

  <!-- Floating Feature Card 4: Active Subscribers (Bottom Left) -->
  <g transform="translate(45, 370)">
    <rect width="185" height="74" rx="16" fill="#0B192C" fill-opacity="0.9" stroke="url(#glowGrad)" stroke-width="1.5" filter="url(#softGlow)"/>
    <circle cx="36" cy="37" r="18" fill="url(#goldGrad)"/>
    <!-- Users Icon -->
    <circle cx="36" cy="32" r="5" fill="#FFFFFF"/>
    <path d="M26 44 C26 39 30 37 36 37 C42 37 46 39 46 44" fill="#FFFFFF"/>
    <text x="65" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">ACTIVE USERS</text>
    <text x="65" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">15.8 M+ <tspan font-size="11" fill="#F59E0B">Live</tspan></text>
  </g>

  <!-- Particle Dots for Network Nodes -->
  <circle cx="210" cy="200" r="4" fill="#00D2FF" filter="url(#softGlow)"/>
  <circle cx="430" cy="210" r="4" fill="#3A86FF" filter="url(#softGlow)"/>
  <circle cx="230" cy="340" r="3.5" fill="#00D2FF"/>
  <circle cx="410" cy="330" r="3.5" fill="#3A86FF"/>
</svg>
