<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" fill="none">
  <!-- Glowing Signal Waves -->
  <defs>
    <linearGradient id="tcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon: Modern 5G Tower & Radio Wave -->
  <g transform="translate(10, 5)">
    <!-- Base tower circle -->
    <circle cx="22" cy="25" r="4.5" fill="url(#tcGrad)" filter="url(#glow)"/>
    <!-- Concentric arcs -->
    <path d="M14 25 A 8 8 0 0 1 30 25" stroke="url(#tcGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M8 25 A 14 14 0 0 1 36 25" stroke="url(#tcGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M2 25 A 20 20 0 0 1 42 25" stroke="url(#tcGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Tower Stem -->
    <path d="M22 29.5 L17 48 L27 48 Z" fill="url(#tcGrad)" opacity="0.9"/>
    <line x1="15" y1="42" x2="29" y2="42" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: TeleConnect -->
  <text x="65" y="34" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5" fill="#FFFFFF">Tele<tspan fill="url(#tcGrad)">Connect</tspan></text>
  <text x="66" y="47" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="7.5" letter-spacing="2" fill="#00D2FF" opacity="0.9">5G NEXT-GEN NETWORK</text>
</svg>
